[project]
name = "rmt"
version = "0.1.0"
description = "A safer rm alternative that moves files to trash instead of deleting them permanently"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "questionary>=2.1.1",
    "typer>=0.27.0",
]

[project.scripts]
rmt = "rmt.main:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmt"]
